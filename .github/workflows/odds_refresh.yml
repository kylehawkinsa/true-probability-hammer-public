name: NHL SOG odds refresh (manual; enable schedule after quota review)
on:
  workflow_dispatch:
# After confirming API subscription/limits, optionally uncomment a cron.
# schedule:
#   - cron: '*/15 15-23,0-4 * * *'   # UTC; many event-market calls/credits!
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "requests>=2.31,<3"
      - name: Collect and append observed quotes
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python odds_worker.py
