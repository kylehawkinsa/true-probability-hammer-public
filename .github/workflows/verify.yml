name: Verify True Probability Hammer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q app.py tph_core.py odds_worker.py storage.py publish_forecasts.py setup_password.py
      - name: Run isolated unit tests (no API credentials required)
        run: python -m unittest discover -s tests -v
